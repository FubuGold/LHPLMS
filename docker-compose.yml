services:
  postgres:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: lms
    ports:
      - "5432:5432" # For db schema migration, wont expose in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local

networks:
  local:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
